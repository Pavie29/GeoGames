<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoGames — World Geography Games</title>
<meta name="description" content="A collection of modern geography games: guess countries by shape, flag, capital, population and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fa; --sunk:#eef1f5;
  --ink:#141821; --muted:#6b7488; --line:#e6e9f0; --line-strong:#d4d9e4;
  --primary:#3563e9; --primary-ink:#254fc4; --primary-tint:#eaf0ff;
  --good:#17a866; --good-bg:#e2f7ee; --warn:#e08a10; --warn-bg:#fdf0d8; --bad:#e23b47; --bad-bg:#fde6e8;
  --shadow:0 1px 2px rgba(20,26,45,.04),0 4px 14px rgba(20,26,45,.06);
  --shadow-md:0 6px 20px rgba(20,26,45,.10);
  --shadow-lg:0 18px 44px rgba(20,26,45,.16);
  --r:14px; --r-lg:20px; --r-sm:10px;
}
:root[data-theme="dark"]{
  --bg:#0c0f16; --surface:#151a24; --surface2:#1b2130; --sunk:#0f131b;
  --ink:#eaeefc; --muted:#93a0bd; --line:#252c3b; --line-strong:#333c4f;
  --primary:#5b82ff; --primary-ink:#3f66ea; --primary-tint:#1a2136;
  --good:#3ad78f; --good-bg:#0f2a1e; --warn:#f0b44a; --warn-bg:#33270f; --bad:#ff6b76; --bad-bg:#331419;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --shadow-md:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.container{max-width:1080px;margin:0 auto;padding:0 22px}
::selection{background:var(--primary);color:#fff}

/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px;flex:none}
.brand .mark path{fill:var(--primary);stroke:none}
.brand:hover .mark{transform:rotate(-12deg);transition:.2s}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:17px;box-shadow:var(--shadow);transition:.15s}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.nav-home{font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;background:var(--primary);color:#fff;box-shadow:var(--shadow);transition:.15s}
.nav-home:hover{background:var(--primary-ink);transform:translateY(-2px);box-shadow:var(--shadow-md)}

#offline{display:none;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);font-size:13px;font-weight:700;text-align:center;padding:9px 12px}
#offline.show{display:block}

main{padding:32px 0 88px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-tint);border:1px solid color-mix(in srgb,var(--primary) 22%,transparent);padding:7px 14px;border-radius:999px;margin-bottom:18px}
.page-head{margin:4px 0 26px}
.page-head h1{font-size:clamp(28px,4.5vw,42px)}
.page-head p{margin:10px 0 0;color:var(--muted);font-size:15.5px;max-width:640px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:16px}
.back:hover{color:var(--primary)}

/* hero */
.hero{margin:6px 0 32px}
.hero h1{font-size:clamp(38px,6.4vw,68px);line-height:1.02;letter-spacing:-.035em}
.hero p{color:var(--muted);font-size:clamp(15px,2vw,18px);margin:16px 0 0;max-width:600px}

/* category tabs */
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:.14s}
.tab:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}
.tab.on{background:var(--primary);border-color:transparent;color:#fff;box-shadow:var(--shadow-md)}
.tab .tcount{font-size:11px;font-weight:800;background:color-mix(in srgb,var(--muted) 16%,transparent);color:var(--muted);padding:1px 8px;border-radius:999px;min-width:20px;text-align:center}
.tab.on .tcount{background:rgba(255,255,255,.24);color:#fff}
.stickybar{position:sticky;top:63px;z-index:30;background:var(--bg);padding:14px 0 4px;margin-bottom:6px}
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;min-width:0;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font);font-size:15px;font-weight:500;outline:none;box-shadow:var(--shadow)}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.tr{display:flex;align-items:center;gap:9px}
.fav{border:none;background:transparent;color:var(--muted);font-size:19px;line-height:1;padding:0;cursor:pointer;transition:.12s;opacity:.6}
.fav:hover{opacity:1;transform:scale(1.2)}
.fav.on{color:#f5a623;opacity:1}
/* achievements */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.ach{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);opacity:.65}
.ach.on{opacity:1;background:var(--surface);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--primary) 30%,var(--line))}
.ach .ae{font-size:26px;filter:grayscale(1) opacity(.7)}
.ach.on .ae{filter:none}
.ach .an{font-weight:800;font-size:14.5px}
.ach .ad{font-size:12.5px;color:var(--muted);line-height:1.35}
.ach .atick{color:var(--good);font-weight:800;font-size:16px}
.ach .alock{opacity:.5}
.btable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.brow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface);transition:.12s;color:var(--ink)}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--surface2)}
.brow .bem{font-size:18px;width:24px;text-align:center}
.brow .bn{font-weight:700;flex:1}
.brow .bv{font-weight:700;color:var(--muted);font-size:13.5px}
/* atlas */
.agridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:.14s;color:var(--ink);font-family:var(--font)}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.ccard .flag{width:100%;height:auto;aspect-ratio:3/2}
.ccard .cn{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.ccard .cc{text-align:center}
.inforow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.il{font-weight:700;color:var(--muted);font-size:13px}
.iv{font-weight:700;font-size:14px;text-align:right}
/* accessibility: visible keyboard focus */
a:focus-visible,button:focus-visible,input:focus-visible,.gcard:focus-visible,.tab:focus-visible,.opt:focus-visible,.ccard:focus-visible,.mcard:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:10px}
.ac-input:focus-visible{outline:none}

/* game grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px}
.gcard{--cc:#3563e9;position:relative;display:flex;flex-direction:column;gap:11px;padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:.18s;min-height:190px}
.gcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--cc);opacity:.9}
.gcard:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--cc) 45%,var(--line))}
.gcard:nth-child(9n+1){--cc:#3563e9}
.gcard:nth-child(9n+2){--cc:#17a866}
.gcard:nth-child(9n+3){--cc:#f2971b}
.gcard:nth-child(9n+4){--cc:#8b5cf6}
.gcard:nth-child(9n+5){--cc:#ef4d5b}
.gcard:nth-child(9n+6){--cc:#0eabc7}
.gcard:nth-child(9n+7){--cc:#ec4899}
.gcard:nth-child(9n+8){--cc:#78bd1a}
.gcard:nth-child(9n+9){--cc:#f2711b}
.gcard-top{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.gcard .idx{font-size:11px;font-weight:800;color:#fff;background:var(--cc);padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.gcard .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.gcard .em{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--cc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--cc) 22%,transparent)}
.gcard h3{font-size:21px}
.gcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;flex:1}
.gcard .stat{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.gcard .stat b{color:var(--ink);font-weight:800}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.center{display:flex;flex-direction:column;align-items:center;gap:16px}
.muted{color:var(--muted)}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:.15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn.primary{background:var(--primary);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--primary-ink)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface2);transform:none;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:var(--shadow)}
.btn.big{padding:14px 24px;font-size:16px}

/* stat chips */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:82px}
.chip .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800}
.chip .v{font-size:23px;font-weight:800;margin-top:2px;letter-spacing:-.02em}

/* flags */
.flag{border-radius:7px;border:1px solid var(--line);object-fit:cover;background:var(--surface2);display:block}
.flag.shadow{box-shadow:var(--shadow)}

/* autocomplete */
.ac-wrap{position:relative;width:100%}
.ac-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font);font-size:16px;font-weight:600;outline:none;transition:.15s}
.ac-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
.ac-input:disabled{opacity:.55}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);max-height:264px;overflow:auto;padding:6px}
.ac-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:600}
.ac-item small{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto}
.ac-item.active,.ac-item:hover{background:var(--primary-tint)}

/* guess rows */
.guesses{display:flex;flex-direction:column;gap:8px}
.guess{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);animation:pop .22s ease}
.guess .gname{font-weight:700;flex:1;display:flex;align-items:center;gap:9px}
.guess .prox{font-weight:800}
.guess .arrow{font-size:18px;width:24px;text-align:center}
.guess.correct{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.guess .bar{height:7px;border-radius:5px;background:var(--sunk);overflow:hidden;width:68px}
.guess .bar>i{display:block;height:100%;border-radius:5px;background:var(--primary)}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* MC options */
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;text-align:center;transition:.13s;color:var(--ink);box-shadow:var(--shadow)}
.opt:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.opt.right{background:var(--good);border-color:transparent;color:#fff}
.opt.wrong{background:var(--bad);border-color:transparent;color:#fff}
.opt:disabled{cursor:default;box-shadow:none}

/* progress */
.prog{height:9px;border-radius:6px;background:var(--sunk);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:6px;background:var(--primary);transition:width .3s}

/* map */
.mapwrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface2);touch-action:none;box-shadow:var(--shadow)}
.mapwrap svg{display:block;width:100%;height:auto}
.geo{fill:color-mix(in srgb,var(--muted) 24%,var(--surface));stroke:var(--surface);stroke-width:.4;transition:fill .12s;cursor:pointer}
.geo:hover{fill:color-mix(in srgb,var(--primary) 60%,var(--surface))}
.geo.right{fill:var(--good)!important}
.geo.wrong{fill:var(--bad)!important}
.geo.reveal{fill:var(--warn)!important}
.geo.static{cursor:default;pointer-events:none}
.sil{fill:var(--primary);stroke:var(--primary-ink);stroke-width:1.2;stroke-linejoin:round}
.map-hint{position:absolute;top:12px;left:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)}
.zoomctl{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;font-weight:800;box-shadow:var(--shadow)}
.zoomctl button:hover{background:var(--primary);color:#fff}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(15,20,35,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);max-width:440px;width:100%;padding:30px;text-align:center;animation:rise .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{margin:8px 0 4px;font-size:27px}
.modal .big-em{font-size:46px}
.share-grid{font-size:20px;letter-spacing:2px;line-height:1.5;margin:12px 0;font-family:ui-monospace,monospace}

.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);animation:rise .22s}

/* higher-lower */
.hl{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.hl .side{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center}
.hl .vs{display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:15px}
.hl .metric{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hl .qmark{font-size:34px;font-weight:800;color:var(--muted)}
.hl .cname{font-size:20px;font-weight:800}
@media(max-width:560px){.hl{grid-template-columns:1fr;gap:10px}.options{grid-template-columns:1fr}}

.flex{display:flex;gap:12px;align-items:center}
.wrap-tiles{position:relative;width:min(360px,86vw);aspect-ratio:3/2;margin:0 auto}
.wrap-tiles img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);border-radius:14px;overflow:hidden}
.tiles i{background:var(--surface2);border:1px solid var(--line);transition:opacity .4s}
.tiles i.rev{opacity:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 15px;background:transparent;border:none;border-radius:9px;color:var(--muted);font-weight:700;font-size:13.5px}
.seg button.on{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.small{font-size:13px}
.kbd{font-family:ui-monospace,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:540px;margin:0 auto}
.mcard{aspect-ratio:3/2;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:13px;text-align:center;padding:5px;transition:.15s;overflow:hidden;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--primary)}
.mcard.face{background:var(--surface)}
.mcard.matched{border-color:var(--good);background:var(--good-bg);cursor:default;box-shadow:none}
.mcard img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.mcard .back{font-size:24px;color:var(--muted);font-weight:800}
@media(max-width:480px){.mgrid{gap:7px}.mcard{font-size:11px}}

</style>
</head>
<body>
<header class="top">
  <div class="container row">
    <a class="brand" href="#/"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.2 L14.3 9.7 L22.8 12 L14.3 14.3 L12 22.8 L9.7 14.3 L1.2 12 L9.7 9.7 Z"/></svg><span>GeoGames</span></a>
    <div class="spacer"></div>
    <a class="nav-home" href="#/">All games</a>
    <a class="icon-btn" href="#/atlas" title="Atlas — study the countries" aria-label="Atlas">📖</a>
    <a class="icon-btn" id="statsBtn" href="#/stats" title="Your stats & achievements" aria-label="Stats">📊</a>
    <button class="icon-btn" id="sfxBtn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
  </div>
  <div id="offline">⚠️ You appear to be offline — flags and maps need an internet connection. Text-based games still work.</div>
</header>
<main><div class="container" id="view"></div></main>
<div id="toast"></div>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:150;display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k==="text")e.textContent=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(let kid of kids.flat()){ if(kid==null||kid===false)continue; e.appendChild(kid.nodeType?kid:document.createTextNode(kid)); }
  return e;
}

const R=6371;
const toRad=d=>d*Math.PI/180;
function haversine(a,b){
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(s)));
}
function bearing(a,b){
  const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

/* ---------- autocomplete (countries or capitals) ---------- */
function autocomplete(source, onPick, placeholder){
  // source: array of {label, sub, a2, data}
  const wrap=h("div",{class:"ac-wrap"});
  const input=h("input",{class:"ac-input",type:"text",placeholder:placeholder||"Type a country…",autocomplete:"off",spellcheck:"false"});
  const list=h("div",{class:"ac-list",style:{display:"none"}});
  wrap.append(input,list); let items=[],active=-1;
  function render(q){
    const nq=norm(q); items=[];
    if(nq){ for(const s of source){ if(norm(s.label).includes(nq)||(s.data&&s.data.alt&&s.data.alt.some(a=>norm(a).includes(nq)))){ items.push(s); if(items.length>=7)break; } } }
    list.innerHTML=""; active=-1;
    if(!items.length){ list.style.display="none"; return; }
    items.forEach((s,i)=>{
      const it=h("div",{class:"ac-item",onmousedown:e=>{e.preventDefault();pick(i);}});
      if(s.a2)it.appendChild(flagImg(s.a2,40,"","shadow")).style && (it.lastChild.width=26,it.lastChild.height=18);
      it.appendChild(h("span",{text:s.label}));
      if(s.sub)it.appendChild(h("small",{text:s.sub}));
      list.appendChild(it);
    });
    list.style.display="block";
  }
  function pick(i){ const s=items[i]; if(!s)return; input.value=""; list.style.display="none"; onPick(s); }
  function move(d){ if(!items.length)return; active=(active+d+items.length)%items.length; [...list.children].forEach((c,i)=>c.classList.toggle("active",i===active)); }
  input.addEventListener("input",()=>render(input.value));
  input.addEventListener("focus",()=>render(input.value));
  input.addEventListener("blur",()=>setTimeout(()=>list.style.display="none",120));
  input.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();move(1);}
    else if(e.key==="ArrowUp"){e.preventDefault();move(-1);}
    else if(e.key==="Enter"){e.preventDefault(); if(active>=0)pick(active); else if(items.length)pick(0); }
    else if(e.key==="Escape")list.style.display="none";
  });
  return {wrap,input,focus:()=>input.focus()};
}

/* ========================================================= SHAPEDLE */
function shapedle(view,opts){
  opts=opts||{}; const daily=!!opts.daily; const id=daily?"daily":"shapedle";
  document.title=(daily?"Daily Challenge":"Shapedle")+" — GeoGames";
  view.appendChild(pageHead(daily?"Daily Challenge":"Shapedle", daily?"One shape for everyone today. Six guesses.":"Guess the mystery country from its shape. Six guesses, with distance & direction clues."));
  const panel=h("div",{class:"panel stack"}); view.appendChild(panel);
  const MAX=6;
  let target, guesses=[], done=false;

  if(daily){
    const rng=mulberry32(daySeed()); const idx=Math.floor(rng()*C.length); target=C[idx];
    const saved=store.get("daily_"+todayKey(),null);
    if(saved){ guesses=saved.guesses.map(a3=>byA3[a3]); done=saved.done; }
  } else {
    target=randOf(C);
  }

  const svgBox=h("div",{class:"center",style:{minHeight:"260px",justifyContent:"center"}}); panel.appendChild(svgBox);
  const acHost=h("div"); panel.appendChild(acHost);
  const gWrap=h("div",{class:"guesses"}); panel.appendChild(gWrap);
  const foot=h("div",{class:"row-wrap"}); panel.appendChild(foot);

  function persistDaily(){ if(daily)store.set("daily_"+todayKey(),{guesses:guesses.map(g=>g.a3),done}); }

  function drawSil(feature){
    const W=420,H=280;
    const proj=d3.geoAzimuthalEqualArea().rotate([-target.lng,-target.lat]).fitExtent([[16,16],[W-16,H-16]],feature);
    const path=d3.geoPath(proj);
    const svg=d3.create("svg").attr("viewBox",[0,0,W,H]).attr("width","100%").style("max-width","440px");
    const defs=svg.append("defs").append("linearGradient").attr("id","silg").attr("x1","0").attr("y1","0").attr("x2","1").attr("y2","1");
    defs.append("stop").attr("offset","0").attr("stop-color","var(--accent)");
    defs.append("stop").attr("offset","1").attr("stop-color","var(--accent2)");
    svg.append("path").attr("d",path(feature)).attr("class","sil");
    svgBox.innerHTML=""; svgBox.appendChild(svg.node());
  }
  function hintFallback(){
    svgBox.innerHTML=""; svgBox.appendChild(h("div",{class:"center"},h("div",{class:"big-em",text:"🧭"}),
      h("p",{class:"muted",style:{textAlign:"center"},html:"Map image unavailable offline.<br>Hint: this country is in <b>"+target.reg+(target.sub?" · "+target.sub:"")+"</b>."})));
  }

  function addGuessRow(c){
    const km=haversine(c,target), correct=c.a3===target.a3, prox=correct?100:proximity(km);
    const row=h("div",{class:"guess"+(correct?" correct":"")},
      flagImg(c.a2,40,"","shadow"),
      h("span",{class:"gname",text:c.n}),
      correct?h("span",{class:"prox",text:"✓"}):h("span",{class:"muted small",text:HARD?"—":fmt(km)+" km"}),
      h("span",{class:"arrow",text:correct?"🎯":arrowFor(bearing(c,target))}),
      (correct||!HARD)?h("span",{class:"bar"},h("i",{style:{width:prox+"%"}})):h("span"),
      (correct||!HARD)?h("span",{class:"prox",text:prox+"%"}):h("span")
    );
    gWrap.appendChild(row);
  }

  function finish(win){
    done=true; persistDaily();
    if(!daily){ const s=stats(id); s.plays++; if(win){s.streak++; if(s.streak>s.best)s.best=s.streak;}else s.streak=0; store.set("stat_"+id,s); }
    renderFoot();
    if(win)confetti();
    const shareNode = daily?buildShare(win):null;
    modal({emoji:win?"🎉":"😵", title:win?"Correct!":"Out of guesses",
      sub:(win?"You got it in "+guesses.length+" / "+MAX+". ":"")+"It was "+target.n+".",
      node: h("div",null, h("div",{class:"center",style:{margin:"6px 0"}},flagImg(target.a2,320,"","shadow")), shareNode||null),
      buttons: daily?[{label:"Share result",primary:true,fn:()=>doShare(win)},{label:"Close",fn:c=>c()}]
                    :[{label:"Play again",primary:true,fn:c=>{c();shapedle(clearView(),{});}},{label:"Home",fn:()=>nav("")}]});
  }
  function buildShare(win){
    let grid=""; guesses.forEach(g=>{ const p=g.a3===target.a3?100:proximity(haversine(g,target)); grid+= p===100?"🟩":p>=80?"🟨":p>=50?"🟧":"⬜"; });
    return h("div",{class:"share-grid",text:grid});
  }
  function shareText(win){
    let grid=""; guesses.forEach(g=>{ const p=g.a3===target.a3?100:proximity(haversine(g,target)); grid+= p===100?"🟩":p>=80?"🟨":p>=50?"🟧":"⬜"; });
    return "GeoGames Daily "+todayKey()+"\n"+(win?guesses.length:"X")+"/"+MAX+"  "+grid+"\nplay: GeoGames";
  }
  function doShare(win){ const t=shareText(win); if(navigator.share){navigator.share({text:t}).catch(()=>{});} else {navigator.clipboard&&navigator.clipboard.writeText(t); toast("Result copied to clipboard!");} }

  function guess(c){
    if(done)return;
    if(guesses.some(g=>g.a3===c.a3)){ toast("Already guessed"); return; }
    guesses.push(c); addGuessRow(c); persistDaily();
    if(c.a3===target.a3){ finish(true); }
    else if(guesses.length>=MAX){ finish(false); }
  }

  const ac=autocomplete(countrySource,s=>guess(s.data),"Guess a country…");
  acHost.appendChild(ac.wrap);

  function renderFoot(){
    foot.innerHTML="";
    foot.appendChild(h("span",{class:"muted small",text:"Guess "+Math.min(guesses.length+(done?0:1),MAX)+" of "+MAX}));
    if(done){ ac.input.disabled=true;
      if(daily)foot.appendChild(h("button",{class:"btn",onclick:()=>doShare(guesses.some(g=>g.a3===target.a3))},"Share"));
      else foot.appendChild(h("button",{class:"btn primary",onclick:()=>shapedle(clearView(),{})},"New country"));
    }
  }

  guesses.forEach(addGuessRow); renderFoot();
  if(done) ac.input.disabled=true;

  loadTopo(WORLD_URL,"countries").then(geo=>{
    const feat=geo.features.find(f=>+f.id===target.id);
    if(feat)drawSil(feat); else hintFallback();
    setTimeout(()=>{ if(!done)ac.focus(); },50);
  }).catch(()=>hintFallback());
}

function higherlower(view){
  document.title="Higher or Lower — GeoGames";
  view.appendChild(pageHead("Higher or Lower","Does the hidden country rank higher or lower? Pick the metric and keep the streak."));
  const panel=h("div",{class:"panel stack"}); view.appendChild(panel);
  let metric=store.get("hl_metric","pop"),streak=0,left=null,right=null,locked=false;
  const top=h("div",{class:"row-wrap",style:{justifyContent:"space-between"}});
  const seg=h("div",{class:"seg"},
    h("button",{onclick:()=>{metric="pop";store.set("hl_metric",metric);reset();}},"Population"),
    h("button",{onclick:()=>{metric="area";store.set("hl_metric",metric);reset();}},"Area (km²)"));
  const bar=h("div",{class:"chips"});
  top.append(seg,bar); panel.appendChild(top);
  const board=h("div",{class:"hl"}); panel.appendChild(board);
  const pool=C.filter(c=>c[metric==="pop"?"pop":"area"]>0);
  function val(c){ return metric==="pop"?c.pop:c.area; }
  function label(){ return metric==="pop"?"people":"km²"; }
  function refreshBar(){ bar.innerHTML=""; bar.append(
    h("div",{class:"chip"},h("div",{class:"k",text:"Streak"}),h("div",{class:"v",text:streak})),
    h("div",{class:"chip"},h("div",{class:"k",text:"Best"}),h("div",{class:"v",text:stats("higherlower").best}))); }
  function setSeg(){ seg.children[0].className=metric==="pop"?"on":""; seg.children[1].className=metric==="area"?"on":""; }
  function reset(){ streak=0; left=randOf(pool); pick2(); render(); }
  function pick2(){ do{ right=randOf(pool);}while(right.a3===left.a3||val(right)===val(left)); }
  function render(revealRight){
    setSeg(); refreshBar(); board.innerHTML="";
    board.append(
      side(left,true),
      h("div",{class:"vs",text:"vs"}),
      side(right,revealRight)
    );

/* ========================================================= STATS & ACHIEVEMENTS */

/* ========================================================= ROUTER */
const routes={ "":home, atlas, shapedle, flagle, flags, capitals, find, higherlower, borders, states,
  daily:(v)=>shapedle(v,{daily:true}), globle, travle, clue, nameall, region, rankit, neighbours, continent,

let cleanup=null;
function clearView(){ const v=$("#view"); v.innerHTML=""; return v; }
function renderRoute(name){
  if(typeof cleanup==="function"){ try{cleanup();}catch(e){} cleanup=null; }
  if(name&&name!=="stats"&&GAMES.some(g=>g.id===name))bumpVisit(name);
  const fn=routes[name]||home;
  const v=clearView();

function currentName(){ let hash=""; try{ hash=location.hash||""; }catch(e){} return hash.replace(/^#\/?/,"").split("/")[0]; }
// nav() drives rendering directly so it works even when the page is loaded from a
// data:/file preview where changing location.hash is blocked by the browser.
function nav(name){ renderRoute(name); try{ history.replaceState(null,"","#/"+name); }catch(e){} }
function render(){ renderRoute(currentName()); }
window.addEventListener("hashchange",render);
// Intercept in-app links (#/...) and route via JS instead of a real hash change.
